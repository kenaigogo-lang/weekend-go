<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>週末去哪</title>
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="週末去哪">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1><span class="brand-dot" aria-hidden="true"></span>週末去哪</h1>
    <div class="origin" id="originSwitch"></div>
  </div>
  <div class="weather-wrap">
    <div id="weather" class="weather">天氣載入中…</div>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button data-tab="pick" class="on" role="tab" aria-selected="true">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M5 3v4M3 5h4M19 17v4M17 19h4"/></svg>
    <span>幫我決定</span>
  </button>
  <button data-tab="routes" role="tab" aria-selected="false">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9 16.2 7.8"/></svg>
    <span>半日遊</span>
  </button>
  <button data-tab="night" role="tab" aria-selected="false">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <span>夜遊</span>
  </button>
  <button data-tab="events" role="tab" aria-selected="false">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-2-2-5 5"/></svg>
    <span>展覽</span>
  </button>
  <button data-tab="log" role="tab" aria-selected="false">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 10l2 2 4-4"/></svg>
    <span>去過</span>
  </button>
</nav>

<main>
  <section id="tab-pick" class="tab on">
    <div class="seg">
      <button data-mode="day">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        <span>白天半日遊</span>
      </button>
      <button data-mode="night">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span>晚上夜遊</span>
      </button>
    </div>
    <div class="chips compact" id="pickFilters"></div>
    <button id="pickBtn" class="big">這次去哪？</button>
    <div id="pickOut"></div>
    <div class="sec-head">
      <h2 class="sec">快結束的展覽</h2>
      <button class="link-btn" data-tab="events">看全部 →</button>
    </div>
    <div id="endingSoon"></div>
  </section>

  <section id="tab-routes" class="tab">
    <div class="chips" id="routeChips"></div>
    <div id="routeList"></div>
  </section>

  <section id="tab-night" class="tab">
    <p class="muted small lead-note">傍晚 6 點左右出發、晚上 10 點左右回到家</p>
    <div class="chips" id="nightDays"></div>
    <h2 class="sec" style="margin-top:8px">這晚的表演・音樂會</h2>
    <div id="showList"></div>
    <div id="nightExhibits"></div>
    <h2 class="sec">晚上吃喝逛</h2>
    <div class="chips" id="spotChips"></div>
    <div id="spotList"></div>
    <h2 class="sec">夜遊路線</h2>
    <div class="chips" id="nightChips"></div>
    <div id="nightList"></div>
  </section>

  <section id="tab-events" class="tab">
    <div class="search-wrap">
      <svg class="ic search-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="evSearch" class="search" type="search" placeholder="搜尋展覽、場館或關鍵字…">
    </div>
    <div class="chips" id="evChips"></div>
    <div class="toolbar" id="evBar"></div>
    <div id="evList"></div>
    <p class="muted small foot-note" id="evUpdated"></p>
    <p class="muted small foot-note" id="evMissing"></p>
  </section>

  <section id="tab-log" class="tab">
    <div id="logList"></div>
    <div class="card howto">
      <div class="howto-title">怎麼記錄？</div>
      <p>在行程頁按「我們去了」，會開一張 GitHub 表單，填好送出就好。系統會自動寫進紀錄，下次推薦時就會避開。</p>
      <p>不想去的路線或展覽，按隱藏按鈕就會先在這支手機藏起來；再點跳出來的「同步到兩支手機」送出表單，兩支手機就都看不到了。</p>
      <p>要記錄沒有在清單上的地方：<a id="freeLog" target="_blank" rel="noopener">手動新增一筆 →</a></p>
    </div>
  </section>
</main>

<div id="detail" class="sheet" hidden></div>

<script src="app.js"></script>
</body>
</html>
