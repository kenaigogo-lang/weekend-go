name: 記錄去過的行程

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  log:
    if: contains(github.event.issue.labels.*.name, 'visited')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 寫入紀錄
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/log_visit.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/visited.json 行程紀錄.md
          git commit -m "記錄行程 #${{ github.event.issue.number }}"
          git pull --rebase
          git push

      - name: 關閉 issue、重新部署網頁
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "已記錄 ✅ 網頁約 1 分鐘後更新。"
          gh workflow run deploy.yml
