name: 更新展覽資料並部署

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"   # 台灣時間每天 05:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 抓展覽資料（失敗就沿用舊的）
        run: python3 scripts/fetch_events.py || echo "::warning::展覽資料抓取失敗，沿用舊資料"

      - name: Commit 新資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/events.json
          if ! git diff --cached --quiet; then
            git commit -m "更新展覽資料"
            git pull --rebase && git push
          fi

      - name: 加版本號，避免手機一直用舊的 app.js
        run: sed -i "s/app.js\"/app.js?v=${GITHUB_SHA::7}\"/; s/style.css\"/style.css?v=${GITHUB_SHA::7}\"/" docs/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
